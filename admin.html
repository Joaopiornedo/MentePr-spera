<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Mente Próspera</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="firebase-config.js"></script>
<style>
:root{
  --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;
  --bg:#f1f5f9;--surf:#fff;--surf2:#f8fafc;--bdr:#e2e8f0;
  --v:#6d28d9;--vl:#ede9fe;
  --g:#059669;--gl:#d1fae5;
  --r:#dc2626;--rl:#fee2e2;
  --a:#d97706;--al:#fef3c7;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── Auth gate ── */
#auth-gate{
  position:fixed;inset:0;z-index:1000;display:flex;
  align-items:center;justify-content:center;
  background:linear-gradient(160deg,#0d0a1a,#1a0f3a,#0d1a35);padding:20px;
}
.auth-card{
  width:100%;max-width:360px;
  background:rgba(255,255,255,.07);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.12);border-radius:24px;
  padding:32px 24px;box-shadow:0 32px 80px rgba(0,0,0,.5);
}
.auth-logo{width:50px;height:50px;border-radius:14px;overflow:hidden;
  background:linear-gradient(135deg,#6d28d9,#8b5cf6);
  display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 14px}
.auth-logo img{width:100%;height:100%;object-fit:cover;border-radius:14px}
.auth-title{font-size:20px;font-weight:900;color:#fff;text-align:center;margin-bottom:3px}
.auth-sub{font-size:12px;color:rgba(255,255,255,.35);text-align:center;margin-bottom:22px}
.auth-field{margin-bottom:12px}
.auth-field label{display:block;font-size:10px;font-weight:700;color:rgba(255,255,255,.4);margin-bottom:5px;letter-spacing:.06em;text-transform:uppercase}
.auth-field input{width:100%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:10px;padding:11px 14px;font-size:14px;color:#fff;outline:none;font-family:inherit;transition:border-color .15s}
.auth-field input:focus{border-color:#8b5cf6}
.auth-field input::placeholder{color:rgba(255,255,255,.2)}
.auth-btn{width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:#fff;font-size:14px;font-weight:800;font-family:inherit;margin-top:4px;transition:opacity .15s}
.auth-btn:hover{opacity:.88}
.auth-btn:disabled{opacity:.4;cursor:not-allowed}
.auth-err{display:none;background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:600;color:#dc2626;margin-bottom:12px;text-align:center}

/* ── Panel ── */
#admin-panel{display:none}
.topbar{
  position:sticky;top:0;z-index:100;height:56px;
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;
  background:var(--surf);border-bottom:1px solid var(--bdr);
}
.tb-brand{display:flex;align-items:center;gap:10px}
.tb-logo{width:30px;height:30px;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#6d28d9,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:15px}
.tb-logo img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.tb-title{font-size:14px;font-weight:800;color:var(--ink)}
.tb-badge{font-size:9px;font-weight:800;padding:2px 7px;border-radius:100px;background:var(--rl);color:var(--r);letter-spacing:.04em}
.tb-right{display:flex;align-items:center;gap:12px}
.tb-email{font-size:12px;color:var(--ink3);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-logout{font-size:12px;font-weight:700;color:var(--r);background:var(--rl);border:none;border-radius:8px;padding:6px 12px;cursor:pointer;transition:opacity .15s}
.btn-logout:hover{opacity:.8}

.wrap{max-width:1100px;margin:0 auto;padding:28px 24px 60px}

/* ── Stats ── */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
.stat-card{background:var(--surf);border:1px solid var(--bdr);border-radius:16px;padding:20px 18px}
.stat-label{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.stat-value{font-size:34px;font-weight:900;line-height:1}
.stat-note{font-size:11px;color:var(--ink3);margin-top:4px}

/* ── Table ── */
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.sec-title{font-size:16px;font-weight:800;color:var(--ink)}
.sec-actions{display:flex;gap:8px;align-items:center}
.search-box{
  background:var(--surf);border:1.5px solid var(--bdr);border-radius:10px;
  padding:8px 14px;font-size:13px;color:var(--ink);outline:none;
  width:240px;font-family:inherit;transition:border-color .15s;
}
.search-box:focus{border-color:var(--v)}
.btn-refresh{
  display:flex;align-items:center;gap:5px;
  padding:8px 14px;border-radius:10px;font-size:12px;font-weight:700;
  background:var(--vl);color:var(--v);border:none;cursor:pointer;transition:all .15s;font-family:inherit;
}
.btn-refresh:hover{background:var(--v);color:#fff}
.btn-refresh:disabled{opacity:.5;cursor:not-allowed}

.table-card{background:var(--surf);border:1px solid var(--bdr);border-radius:16px;overflow:hidden}
table{width:100%;border-collapse:collapse}
thead{background:var(--surf2)}
th{padding:10px 16px;font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;text-align:left;border-bottom:1px solid var(--bdr)}
td{padding:13px 16px;font-size:13px;border-bottom:1px solid var(--bdr)}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surf2)}
.td-name{font-weight:700;color:var(--ink)}
.td-email{color:var(--ink2)}
.td-date{color:var(--ink3);font-size:12px}

.badge{display:inline-block;padding:3px 9px;border-radius:100px;font-size:10px;font-weight:700}
.b-new{background:var(--vl);color:var(--v)}
.b-active{background:var(--gl);color:var(--g)}
.b-old{background:var(--surf2);color:var(--ink3)}

.avatar{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#6d28d9,#8b5cf6);
  color:#fff;font-size:13px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}
.user-cell{display:flex;align-items:center;gap:10px}

.empty-row{padding:48px;text-align:center;color:var(--ink3)}
.empty-icon{font-size:32px;margin-bottom:8px}

/* pagination */
.pag{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--bdr);font-size:12px;color:var(--ink3)}
.pag-btns{display:flex;gap:6px}
.pag-btn{padding:5px 12px;border-radius:8px;font-size:12px;font-weight:700;border:1px solid var(--bdr);background:var(--surf);color:var(--ink2);cursor:pointer;transition:all .15s;font-family:inherit}
.pag-btn:hover:not(:disabled){border-color:var(--v);color:var(--v)}
.pag-btn:disabled{opacity:.35;cursor:not-allowed}

/* Loading spinner */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--bdr);border-top-color:var(--v);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:700px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .search-box{width:100%}
  .sec-header{flex-direction:column;align-items:flex-start}
  th:nth-child(3),td:nth-child(3),th:nth-child(4),td:nth-child(4){display:none}
  .wrap{padding:16px 14px 40px}
  .tb-email{display:none}
}
</style>
</head>
<body>

<!-- ══ AUTH GATE ══ -->
<div id="auth-gate">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="icons/icon-192.png" alt="" onerror="this.parentElement.innerHTML='🔐'">
    </div>
    <div class="auth-title">Painel de Admin</div>
    <div class="auth-sub">Mente Próspera · Acesso restrito</div>
    <div class="auth-err" id="auth-err"></div>
    <div class="auth-field">
      <label>Email</label>
      <input type="email" id="in-email" placeholder="teu@email.com" autocomplete="email">
    </div>
    <div class="auth-field">
      <label>Senha</label>
      <input type="password" id="in-pass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="auth-btn" id="btn-login" onclick="doLogin()">Entrar</button>
  </div>
</div>

<!-- ══ ADMIN PANEL ══ -->
<div id="admin-panel">

  <div class="topbar">
    <div class="tb-brand">
      <div class="tb-logo">
        <img src="icons/icon-192.png" alt="" onerror="this.parentElement.innerHTML='💰'">
      </div>
      <div class="tb-title">Mente Próspera</div>
      <span class="tb-badge">ADMIN</span>
    </div>
    <div class="tb-right">
      <span class="tb-email" id="tb-email"></span>
      <button class="btn-logout" onclick="doLogout()">Sair</button>
    </div>
  </div>

  <div class="wrap">

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total de utilizadores</div>
        <div class="stat-value" id="s-total" style="color:var(--v)">—</div>
        <div class="stat-note">registados na app</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Novos esta semana</div>
        <div class="stat-value" id="s-week" style="color:var(--g)">—</div>
        <div class="stat-note">últimos 7 dias</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Activos este mês</div>
        <div class="stat-value" id="s-month" style="color:var(--a)">—</div>
        <div class="stat-note">entraram nos últimos 30 dias</div>
      </div>
    </div>

    <!-- Table -->
    <div class="sec-header">
      <div class="sec-title">👥 Utilizadores registados</div>
      <div class="sec-actions">
        <input class="search-box" id="search" placeholder="Pesquisar por nome ou email…" oninput="filterUsers(this.value)">
        <button class="btn-refresh" id="btn-refresh" onclick="loadUsers()">
          <span id="ref-icon">🔄</span> Actualizar
        </button>
      </div>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Utilizador</th>
            <th>Email</th>
            <th>Registado em</th>
            <th>Último acesso</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="5" class="empty-row">
            <div class="empty-icon">⏳</div>
            <div>A carregar…</div>
          </td></tr>
        </tbody>
      </table>
      <div class="pag" id="pag" style="display:none">
        <span id="pag-info"></span>
        <div class="pag-btns">
          <button class="pag-btn" id="pag-prev" onclick="changePage(-1)">← Anterior</button>
          <button class="pag-btn" id="pag-next" onclick="changePage(1)">Seguinte →</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script type="module">
import { initializeApp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, getDocs, query, orderBy }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// ══════════════════════════════════════════
//  ↓ ÚNICO CAMPO QUE TENS DE ALTERAR ↓
const ADMIN_EMAIL = 'joaop.codes@gmail.com';
// ══════════════════════════════════════════

const app  = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db   = getFirestore(app);

// ── state ──
let all      = [];
let filtered = [];
let page     = 0;
const PER    = 25;

// ── auth ──────────────────────────────────────────────────────
onAuthStateChanged(auth, user => {
  if (user && user.email === ADMIN_EMAIL) {
    document.getElementById('auth-gate').style.display  = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    document.getElementById('tb-email').textContent      = user.email;
    loadUsers();
  } else {
    if (user) { signOut(auth); showErr('Este email não tem acesso de admin.'); }
    document.getElementById('auth-gate').style.display   = 'flex';
    document.getElementById('admin-panel').style.display = 'none';
  }
});

window.doLogin = async () => {
  const email = document.getElementById('in-email').value.trim();
  const pass  = document.getElementById('in-pass').value;
  clearErr();
  if (!email || !pass) return showErr('Preenche email e senha.');
  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = '…';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    showErr(fbMsg(e.code));
    btn.disabled = false; btn.textContent = 'Entrar';
  }
};

window.doLogout = () => signOut(auth);

// Enter key to submit
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const gate = document.getElementById('auth-gate');
  if (gate.style.display !== 'none') document.getElementById('btn-login').click();
});

// ── load users from Firestore ─────────────────────────────────
window.loadUsers = async () => {
  const btn  = document.getElementById('btn-refresh');
  const icon = document.getElementById('ref-icon');
  btn.disabled = true;
  icon.innerHTML = '<span class="spinner"></span>';
  setEmpty('⏳', 'A carregar utilizadores…');

  try {
    const q    = query(collection(db, 'users_public'), orderBy('registeredAt', 'desc'));
    const snap = await getDocs(q);
    all = snap.docs.map(d => d.data());
    filtered = [...all];
    page = 0;
    updateStats(all);
    renderTable();
  } catch(e) {
    setEmpty('❌', `Erro ao carregar: ${e.message}`);
  } finally {
    btn.disabled = false;
    icon.textContent = '🔄';
  }
};

// ── stats ──────────────────────────────────────────────────────
function updateStats(users) {
  const now   = Date.now();
  const WEEK  = 7  * 86400000;
  const MONTH = 30 * 86400000;

  const ts = u => u.registeredAt?.seconds
    ? u.registeredAt.seconds * 1000
    : new Date(u.registeredAt || 0).getTime();

  const lts = u => u.lastLoginAt?.seconds
    ? u.lastLoginAt.seconds * 1000
    : new Date(u.lastLoginAt || 0).getTime();

  document.getElementById('s-total').textContent = users.length;
  document.getElementById('s-week').textContent  = users.filter(u => now - ts(u) < WEEK).length;
  document.getElementById('s-month').textContent = users.filter(u => now - lts(u) < MONTH).length;
}

// ── table ──────────────────────────────────────────────────────
function renderTable() {
  const tbody = document.getElementById('tbody');
  const start = page * PER;
  const slice = filtered.slice(start, start + PER);

  if (!filtered.length) {
    setEmpty('🔍', 'Nenhum utilizador encontrado.');
    document.getElementById('pag').style.display = 'none';
    return;
  }

  const now  = Date.now();
  const WEEK = 7 * 86400000;
  const MON  = 30 * 86400000;

  const ts = u => u.registeredAt?.seconds
    ? u.registeredAt.seconds * 1000
    : new Date(u.registeredAt || 0).getTime();
  const lts = u => u.lastLoginAt?.seconds
    ? u.lastLoginAt.seconds * 1000
    : new Date(u.lastLoginAt || 0).getTime();

  tbody.innerHTML = slice.map(u => {
    const name    = u.displayName || '—';
    const email   = u.email       || '—';
    const regDate = ts(u)  ? fmt(ts(u))  : '—';
    const logDate = lts(u) ? fmt(lts(u)) : '—';
    const isNew   = now - ts(u) < WEEK;
    const isAct   = now - lts(u) < MON;
    const badge   = isNew ? '<span class="badge b-new">Novo</span>'
                  : isAct ? '<span class="badge b-active">Activo</span>'
                  :          '<span class="badge b-old">Inactivo</span>';
    const av      = (name !== '—' ? name : email)[0].toUpperCase();

    return `<tr>
      <td><div class="user-cell">
        <div class="avatar">${esc(av)}</div>
        <span class="td-name">${esc(name)}</span>
      </div></td>
      <td class="td-email">${esc(email)}</td>
      <td class="td-date">${regDate}</td>
      <td class="td-date">${logDate}</td>
      <td>${badge}</td>
    </tr>`;
  }).join('');

  // pagination
  const total = filtered.length;
  const pages = Math.ceil(total / PER);
  const pag   = document.getElementById('pag');
  pag.style.display = pages > 1 ? 'flex' : 'none';
  document.getElementById('pag-info').textContent =
    `${start + 1}–${Math.min(start + PER, total)} de ${total} utilizadores`;
  document.getElementById('pag-prev').disabled = page === 0;
  document.getElementById('pag-next').disabled = page >= pages - 1;
}

window.changePage = dir => { page += dir; renderTable(); };

// ── search ─────────────────────────────────────────────────────
window.filterUsers = q => {
  const lq = q.toLowerCase().trim();
  filtered  = lq
    ? all.filter(u =>
        (u.email       || '').toLowerCase().includes(lq) ||
        (u.displayName || '').toLowerCase().includes(lq))
    : [...all];
  page = 0;
  renderTable();
};

// ── helpers ─────────────────────────────────────────────────────
function fmt(ms) {
  const d = new Date(ms);
  return d.toLocaleDateString('pt', {day:'2-digit',month:'short',year:'numeric'});
}
function esc(s) {
  return String(s||'').replace(/[&<>'"]/g,
    c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}
function setEmpty(icon, msg) {
  document.getElementById('tbody').innerHTML =
    `<tr><td colspan="5" class="empty-row">
      <div class="empty-icon">${icon}</div><div>${msg}</div>
    </td></tr>`;
  document.getElementById('pag').style.display = 'none';
}
function showErr(m) {
  const e = document.getElementById('auth-err');
  e.textContent = m; e.style.display = 'block';
}
function clearErr() {
  document.getElementById('auth-err').style.display = 'none';
}
function fbMsg(code) {
  return ({
    'auth/invalid-credential':    'Email ou senha incorrectos.',
    'auth/user-not-found':        'Email não encontrado.',
    'auth/wrong-password':        'Senha incorrecta.',
    'auth/too-many-requests':     'Demasiadas tentativas. Espera um pouco.',
    'auth/network-request-failed':'Sem ligação à internet.',
  })[code] || `Erro: ${code}`;
}
</script>
</body>
</html>
