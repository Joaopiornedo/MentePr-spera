<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Calculadora de Liberdade Financeira — Calculadora da Virada</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;
  --surf:#fff;--surf2:#f8fafc;--bdr:#e2e8f0;
  --v:#6d28d9;--v2:#8b5cf6;--vl:#ede9fe;
  --g:#059669;--gl:#d1fae5;
  --a:#d97706;--al:#fef3c7;
  --r:#dc2626;--rl:#fee2e2;
  --c:#0891b2;--cl:#cffafe;
  --glow:rgba(109,40,217,.18);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:#f1f5f9;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:100px;background:var(--bdr);outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--v);cursor:pointer;box-shadow:0 2px 8px var(--glow);}

.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* ── Header ── */
.header{background:linear-gradient(135deg,#2e0d6b,#4c1d95,#6d28d9);padding:32px 16px 40px;text-align:center;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='50' height='50' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='1' cy='1' r='1' fill='%23fff' opacity='.04'/%3E%3C/svg%3E") repeat;}
.header-back{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.header-back:hover{background:rgba(255,255,255,.2)}
.header-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:100px;padding:5px 14px;font-size:11px;font-weight:700;color:rgba(255,255,255,.8);margin-bottom:16px}
.header h1{font-size:clamp(24px,5vw,40px);font-weight:900;color:#fff;line-height:1.15;margin-bottom:10px;position:relative}
.header p{font-size:14px;color:rgba(255,255,255,.65);max-width:480px;margin:0 auto;position:relative;line-height:1.6}

/* ── Main ── */
.main{padding:24px 16px 80px}

/* ── Card ── */
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:20px;padding:24px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card-title{font-size:13px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:18px;display:flex;align-items:center;gap:8px}

/* ── Field ── */
.field{margin-bottom:18px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.field-row{display:flex;align-items:center;gap:8px}
.field-prefix{font-size:15px;font-weight:700;color:var(--ink3);flex-shrink:0}
.field input[type=number]{flex:1;background:var(--surf2);border:1.5px solid var(--bdr);border-radius:12px;padding:10px 14px;font-size:16px;font-weight:700;color:var(--ink);outline:none;transition:border-color .15s;width:100%}
.field input[type=number]:focus{border-color:var(--v)}
.field-note{font-size:11px;color:var(--ink3);margin-top:4px}
.field-hint{font-size:11px;color:var(--v);font-weight:600;margin-top:4px}

/* ── Slider field ── */
.slider-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-top:6px}
.slider-val{background:var(--vl);color:var(--v);font-size:13px;font-weight:800;padding:4px 12px;border-radius:8px;min-width:56px;text-align:center}

/* ── Profiles ── */
.profiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.profile-btn{border:1.5px solid var(--bdr);border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;transition:all .15s;background:var(--surf2)}
.profile-btn:hover{border-color:var(--v)}
.profile-btn.active{border-color:var(--v);background:var(--vl)}
.profile-btn .picon{font-size:22px;margin-bottom:4px}
.profile-btn .plabel{font-size:11px;font-weight:700;color:var(--ink2)}
.profile-btn.active .plabel{color:var(--v)}
.profile-btn .prate{font-size:10px;color:var(--ink3)}

/* ── Results ── */
.result-hero{background:linear-gradient(135deg,#2e0d6b,#6d28d9);border-radius:20px;padding:28px;text-align:center;margin-bottom:16px;position:relative;overflow:hidden}
.result-hero::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='40' height='40' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='1' cy='1' r='1' fill='%23fff' opacity='.04'/%3E%3C/svg%3E") repeat;}
.result-hero-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:8px;position:relative}
.result-hero-value{font-size:clamp(40px,10vw,72px);font-weight:900;color:#fff;line-height:1;letter-spacing:-.02em;position:relative}
.result-hero-sub{font-size:13px;color:rgba(255,255,255,.6);margin-top:8px;position:relative}
.result-hero-date{font-size:18px;font-weight:800;color:#a78bfa;margin-top:4px;position:relative}

.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.result-card{background:var(--surf);border:1px solid var(--bdr);border-radius:16px;padding:18px}
.result-card-label{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.result-card-value{font-size:22px;font-weight:900;line-height:1.15}
.result-card-note{font-size:11px;color:var(--ink3);margin-top:4px}

/* ── Progress bar ── */
.prog-wrap{margin-bottom:16px}
.prog-label{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.prog-bar{height:12px;border-radius:100px;background:var(--bdr);overflow:hidden}
.prog-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--v),var(--v2));transition:width .6s cubic-bezier(.4,0,.2,1)}

/* ── Milestones ── */
.milestones{display:flex;flex-direction:column;gap:8px}
.milestone{display:flex;align-items:center;gap:12px;background:var(--surf2);border:1px solid var(--bdr);border-radius:14px;padding:14px}
.milestone.highlight{background:linear-gradient(135deg,#2e0d6b,#6d28d9);border-color:transparent}
.milestone-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.milestone-body{flex:1}
.milestone-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:2px}
.milestone.highlight .milestone-title{color:#fff}
.milestone-sub{font-size:12px;color:var(--ink3)}
