<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mente Próspera — Controla o Teu Dinheiro de Vez</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #F0D080;
    --gold-pale: #FDF8EC;
    --dark: #0D0D1A;
    --dark2: #141428;
    --dark3: #1E1E38;
    --white: #FFFFFF;
    --gray: #9CA3AF;
    --light: #F9FAFB;
    --green: #10B981;
    --red: #EF4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--dark); color: var(--white); font-family: 'DM Sans', sans-serif; overflow-x: hidden; }

  /* ── HEADER STICKY ── */
  .sticky-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 999;
    background: rgba(13,13,26,0.97); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(201,168,76,0.2);
    padding: 10px 24px;
    display: flex; align-items: center; justify-content: space-between;
    transform: translateY(0); transition: transform 0.4s ease;
  }
  .sticky-bar.visible { transform: translateY(0); }
  .lang-sel { display: flex; gap: 4px; }
  .lang-sel button {
    background: none; border: 1px solid rgba(201,168,76,0.3); color: #9CA3AF;
    font-weight: 600; font-size: 0.8rem; padding: 5px 10px; border-radius: 6px;
    cursor: pointer; font-family: inherit; transition: all 0.2s;
  }
  .lang-sel button[data-active="1"] { color: #0D0D1A; background: #C9A84C; border-color: #C9A84C; }
  .sticky-bar .logo { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.1rem; }
  .sticky-cta { background: var(--gold); color: var(--dark); padding: 8px 20px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; text-decoration: none; white-space: nowrap; }

  /* ── HERO ── */
  .hero {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden; padding: 120px 24px 80px;
    background: radial-gradient(ellipse at 20% 50%, rgba(201,168,76,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(201,168,76,0.05) 0%, transparent 50%),
                var(--dark);
  }
  .hero::before {
    content: ''; position: absolute; inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23C9A84C' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    pointer-events: none;
  }
  .hero-inner { max-width: 860px; text-align: center; position: relative; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(201,168,76,0.12); border: 1px solid rgba(201,168,76,0.3);
    color: var(--gold); padding: 6px 18px; border-radius: 100px; font-size: 0.8rem;
    font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 28px;
    animation: fadeDown 0.6s ease both;
  }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.6rem, 6vw, 4.8rem); line-height: 1.1;
    animation: fadeDown 0.6s 0.15s ease both;
  }
  .hero h1 span { color: var(--gold); display: block; }
  .hero-sub {
    font-size: clamp(1rem, 2.5vw, 1.3rem); color: var(--gray); margin: 24px auto 0;
    max-width: 640px; line-height: 1.7; animation: fadeDown 0.6s 0.3s ease both;
  }
  .hero-promise {
    display: flex; justify-content: center; gap: 32px; flex-wrap: wrap;
    margin: 40px 0; animation: fadeDown 0.6s 0.45s ease both;
  }
  .promise-item { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--gray); }
  .promise-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .hero-cta-wrap { animation: fadeDown 0.6s 0.6s ease both; }
  .btn-primary {
    display: inline-block; background: linear-gradient(135deg, var(--gold), #E8C040);
    color: var(--dark); font-size: 1.1rem; font-weight: 700; padding: 18px 48px;
    border-radius: 8px; text-decoration: none; cursor: pointer; border: none;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 8px 32px rgba(201,168,76,0.35);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(201,168,76,0.5); }
  .btn-sub { font-size: 0.8rem; color: var(--gray); margin-top: 14px; }
  .btn-sub span { color: var(--green); font-weight: 600; }

  /* ── URGENCY TIMER ── */
  .urgency {
    display: flex; align-items: center; justify-content: center; gap: 16px;
    background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
    padding: 12px 24px; border-radius: 8px; margin-top: 24px;
    animation: pulse 2s infinite;
  }
  .urgency-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: blink 1s infinite; }
  .urgency p { font-size: 0.85rem; color: #FCA5A5; }
  .urgency strong { color: var(--red); }
  #countdown { font-family: 'DM Mono', monospace; font-size: 1rem; color: var(--red); font-weight: 500; }

  /* ── PAIN SECTION ── */
  .pain { background: var(--dark2); padding: 80px 24px; }
  .pain-inner { max-width: 800px; margin: 0 auto; }
  .pain h2 { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 4vw, 2.8rem); margin-bottom: 32px; text-align: center; }
  .pain-list { display: grid; gap: 16px; }
  .pain-item {
    display: flex; align-items: flex-start; gap: 16px;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
    padding: 20px 24px; border-radius: 10px;
  }
  .pain-icon { font-size: 1.4rem; flex-shrink: 0; margin-top: 2px; }
  .pain-item p { font-size: 1rem; line-height: 1.6; color: #D1D5DB; }
  .pain-item p strong { color: var(--white); }
  .pain-cta { text-align: center; margin-top: 48px; }
  .pain-bridge { font-size: 1.15rem; color: var(--gray); margin-bottom: 28px; max-width: 600px; margin-left: auto; margin-right: auto; line-height: 1.7; }

  /* ── WHAT YOU GET ── */
  .offer { padding: 80px 24px; background: var(--dark); }
  .offer-inner { max-width: 960px; margin: 0 auto; }
  .section-label { text-align: center; color: var(--gold); font-size: 0.8rem; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 600; margin-bottom: 12px; }
  .section-title { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 4vw, 3rem); text-align: center; margin-bottom: 16px; }
  .section-sub { text-align: center; color: var(--gray); font-size: 1rem; max-width: 540px; margin: 0 auto 56px; line-height: 1.7; }
  .chapters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
  .chapter-card {
    background: var(--dark3); border: 1px solid rgba(201,168,76,0.15);
    border-radius: 12px; padding: 28px; position: relative; overflow: hidden;
    transition: border-color 0.3s, transform 0.3s;
  }
  .chapter-card:hover { border-color: rgba(201,168,76,0.5); transform: translateY(-4px); }
  .chapter-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--gold), transparent); }
  .chap-num { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: rgba(201,168,76,0.2); font-weight: 900; line-height: 1; margin-bottom: 8px; }
  .chap-title { font-weight: 700; font-size: 1rem; margin-bottom: 10px; }
  .chap-desc { font-size: 0.85rem; color: var(--gray); line-height: 1.6; }

  /* ── BONUSES ── */
  .bonuses { background: var(--dark2); padding: 80px 24px; }
  .bonus-list { max-width: 720px; margin: 0 auto; display: grid; gap: 16px; }
  .bonus-item {
    display: flex; align-items: center; gap: 20px;
    background: linear-gradient(135deg, rgba(201,168,76,0.08), rgba(201,168,76,0.03));
    border: 1px solid rgba(201,168,76,0.2); border-radius: 12px; padding: 24px;
  }
  .bonus-icon { font-size: 2rem; flex-shrink: 0; }
  .bonus-text h4 { font-weight: 700; margin-bottom: 4px; }
  .bonus-text p { font-size: 0.85rem; color: var(--gray); line-height: 1.5; }
  .bonus-value { margin-left: auto; text-align: right; flex-shrink: 0; }
  .bonus-value .old { font-size: 0.75rem; color: var(--gray); text-decoration: line-through; }
  .bonus-value .free { font-size: 0.9rem; color: var(--green); font-weight: 700; }

  /* ── TESTIMONIALS ── */
  .social { padding: 80px 24px; background: var(--dark); }
  .testi-grid { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
  .testi-card {
    background: var(--dark3); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px; padding: 28px;
  }
  .testi-stars { color: var(--gold); font-size: 0.9rem; margin-bottom: 12px; letter-spacing: 2px; }
  .testi-text { font-size: 0.9rem; color: #D1D5DB; line-height: 1.7; margin-bottom: 16px; font-style: italic; }
  .testi-author { display: flex; align-items: center; gap: 12px; }
  .testi-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), #8B6914); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1rem; color: var(--dark); }
  .testi-name { font-weight: 600; font-size: 0.9rem; }
  .testi-loc { font-size: 0.75rem; color: var(--gray); }

  /* ── PRICING ── */
  .pricing { background: var(--dark2); padding: 80px 24px; }
  .price-card {
    max-width: 520px; margin: 0 auto;
    background: var(--dark3); border: 2px solid var(--gold);
    border-radius: 20px; overflow: hidden;
    box-shadow: 0 0 60px rgba(201,168,76,0.2);
  }
  .price-header {
    background: linear-gradient(135deg, var(--dark), var(--dark3));
    padding: 32px; text-align: center;
    border-bottom: 1px solid rgba(201,168,76,0.2);
  }
  .price-header h3 { font-family: 'Playfair Display', serif; font-size: 1.6rem; margin-bottom: 8px; }
  .price-header p { color: var(--gray); font-size: 0.9rem; }
  .price-body { padding: 32px; }
  .price-amount { text-align: center; margin-bottom: 28px; }
  .price-was { font-size: 1rem; color: var(--gray); text-decoration: line-through; margin-bottom: 4px; }
  .price-now { font-size: 4rem; font-weight: 800; color: var(--gold); font-family: 'Playfair Display', serif; line-height: 1; }
  .price-now sup { font-size: 1.8rem; vertical-align: super; }
  .price-period { font-size: 0.85rem; color: var(--gray); margin-top: 4px; }
  .price-includes { list-style: none; margin-bottom: 28px; display: grid; gap: 12px; }
  .price-includes li { display: flex; align-items: center; gap: 12px; font-size: 0.9rem; color: #D1D5DB; }
  .price-includes .chk { color: var(--green); font-weight: 700; font-size: 1rem; }
  .price-cta { width: 100%; background: linear-gradient(135deg, var(--gold), #E8C040); color: var(--dark); font-size: 1.1rem; font-weight: 700; padding: 18px; border-radius: 8px; border: none; cursor: pointer; transition: transform 0.2s; }
  .price-cta:hover { transform: scale(1.02); }
  .price-guarantee { text-align: center; margin-top: 20px; font-size: 0.8rem; color: var(--gray); display: flex; align-items: center; justify-content: center; gap: 6px; }
  .price-guarantee .shield { font-size: 1rem; }

  /* ── FAQ ── */
  .faq { padding: 80px 24px; background: var(--dark); }
  .faq-list { max-width: 720px; margin: 0 auto; display: grid; gap: 12px; }
  .faq-item {
    background: var(--dark3); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px; overflow: hidden;
  }
  .faq-q {
    padding: 20px 24px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; font-size: 0.95rem;
  }
  .faq-q::after { content: '+'; color: var(--gold); font-size: 1.4rem; transition: transform 0.3s; }
  .faq-item.open .faq-q::after { transform: rotate(45deg); }
  .faq-a { max-height: 0; overflow: hidden; transition: max-height 0.4s ease, padding 0.3s; padding: 0 24px; font-size: 0.9rem; color: var(--gray); line-height: 1.7; }
  .faq-item.open .faq-a { max-height: 200px; padding: 0 24px 20px; }

  /* ── FINAL CTA ── */
  .final-cta {
    padding: 100px 24px; text-align: center;
    background: radial-gradient(ellipse at center, rgba(201,168,76,0.12) 0%, transparent 70%), var(--dark2);
  }
  .final-cta h2 { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 5vw, 3.5rem); margin-bottom: 16px; max-width: 700px; margin-left: auto; margin-right: auto; }
  .final-cta p { color: var(--gray); margin-bottom: 40px; font-size: 1.05rem; max-width: 500px; margin-left: auto; margin-right: auto; line-height: 1.7; }

  /* ── FOOTER ── */
  footer { background: var(--dark); border-top: 1px solid rgba(255,255,255,0.05); padding: 40px 24px; text-align: center; }
  footer p { color: var(--gray); font-size: 0.8rem; line-height: 1.8; }
  footer .links { display: flex; justify-content: center; gap: 24px; margin-bottom: 16px; }
  footer .links a { color: var(--gray); font-size: 0.8rem; text-decoration: none; }
  footer .links a:hover { color: var(--gold); }

  /* ── ANIMATIONS ── */
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.85; } }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  .reveal { opacity: 0; transform: translateY(32px); transition: opacity 0.7s ease, transform 0.7s ease; }
  .reveal.visible { opacity: 1; transform: translateY(0); }
</style>
</head>

<script>
const FUNIL_HTML = {"pt": "<!-- STICKY BAR -->\n<div class=\"sticky-bar\" id=\"stickyBar\">\n  <span class=\"logo\">💰 Mente Próspera</span>\n  <div class=\"lang-sel\">\n    <button onclick=\"setFunilLang('pt')\" data-l=\"pt\">PT</button>\n    <button onclick=\"setFunilLang('en')\" data-l=\"en\">EN</button>\n    <button onclick=\"setFunilLang('es')\" data-l=\"es\">ES</button>\n  </div>\n  \n</div>\n\n<!-- ═══ HERO ═══ -->\n<section class=\"hero\">\n  <div class=\"hero-inner\">\n    <div class=\"badge\">⚡ A app de finanças que cabe no teu bolso</div>\n    <h1>Para de sobreviver. <span>Começa a prosperar.</span></h1>\n    <p class=\"hero-sub\">A aplicação completa para organizares o teu orçamento, planeares investimentos e descobrires quando atinges a tua liberdade financeira — em qualquer moeda, em 3 idiomas.</p>\n    <div class=\"hero-promise\">\n      <div class=\"promise-item\"><div class=\"dot\"></div> Sem matemática complexa</div>\n      <div class=\"promise-item\"><div class=\"dot\"></div> Funciona em qualquer país</div>\n      <div class=\"promise-item\"><div class=\"dot\"></div> Acesso imediato</div>\n      <div class=\"promise-item\"><div class=\"dot\"></div> Garantia 15 dias</div>\n    </div>\n    <div class=\"hero-cta-wrap\">\n      <a href=\"#checkout\" class=\"btn-primary\">🔓 Quero Começar Agora — €12,90</a>\n      <p class=\"btn-sub\">Preço normal €39,90 · <span>Oferta por tempo limitado</span></p>\n      <div class=\"urgency\" style=\"max-width:480px;margin:24px auto 0;\">\n        <div class=\"urgency-dot\"></div>\n        <p><strong>A oferta termina em:</strong> <span id=\"countdown\">23:47:12</span></p>\n      </div>\n    </div>\n  </div>\n</section>\n\n<!-- ═══ PAIN ═══ -->\n<section class=\"pain\">\n  <div class=\"pain-inner reveal\">\n    <h2>Identificas-te com alguma destas situações?</h2>\n    <div class=\"pain-list\">\n      <div class=\"pain-item\"><div class=\"pain-icon\">😰</div><p><strong>Chegas ao fim do mês a contar os trocos</strong> — ou let _cdTimer = null;

// Efeitos que dependem do conteúdo (re-correm após troca de idioma)
function bindContentEffects(){
  // Scroll reveal
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

  // FAQ accordion
  document.querySelectorAll('.faq-q').forEach(q => {
    q.addEventListener('click', () => {
      const item = q.parentElement;
      const isOpen = item.classList.contains('open');
      document.querySelectorAll('.faq-item').forEach(i => i.classList.remove('open'));
      if (!isOpen) item.classList.add('open');
    });
  });

  // Countdown (reinicia o timer para apontar ao novo elemento)
  if(_cdTimer) clearInterval(_cdTimer);
  function updateCountdown(){
    const el = document.getElementById('countdown');
    if(!el) return;
    const stored = localStorage.getItem('cdExpiry');
    let expiry = stored ? parseInt(stored) : Date.now() + 23*3600000 + 47*60000 + 12000;
    if(!stored){ try{ localStorage.setItem('cdExpiry', expiry); }catch(e){} }
    let diff = Math.max(0, expiry - Date.now());
    const hh = Math.floor(diff/3600000); diff -= hh*3600000;
    const mm = Math.floor(diff/60000); diff -= mm*60000;
    const ss = Math.floor(diff/1000);
    el.textContent = String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
  }
  updateCountdown();
  _cdTimer = setInterval(updateCountdown, 1000);
}

window.addEventListener('scroll', () => {
  const bar = document.getElementById('stickyBar');
  if(!bar) return;
  if (window.scrollY > 400) bar.classList.add('visible');
  else bar.classList.remove('visible');
});

function setFunilLang(l){
  const c = document.getElementById('funil-content');
  if(!c) return;
  c.innerHTML = FUNIL_HTML[l] || FUNIL_HTML.pt;
  localStorage.setItem('cvLang', l);
  document.documentElement.lang = l;
  bindContentEffects();
  // destaca o idioma ativo (os botões estão no conteúdo, recriados a cada troca)
  document.querySelectorAll('.lang-sel button').forEach(b=>{
    b.setAttribute('data-active', b.getAttribute('data-l')===l ? '1' : '0');
  });
}

(function(){
  var l = localStorage.getItem('cvLang') || 'pt';
  if(!['pt','en','es'].includes(l)) l = 'pt';
  setFunilLang(l);
})();
</script>
</body>
</html>
